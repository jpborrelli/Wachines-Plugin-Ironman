name: release

# Auto-bump del plugin en cada push a main, derivado de Conventional Commits.
# El equipo mergea PRs como siempre; este workflow sube la `version` de
# .claude-plugin/plugin.json + CHANGELOG y crea el tag, así el auto-update del
# plugin (autoUpdate: true) le llega a todo el equipo en el próximo startup.
#
# main está protegida por un ruleset org que exige PR. El GITHUB_TOKEN no lo
# bypassea, pero la GitHub App `perennia-automerge` SÍ está en el bypass del
# ruleset → minteamos un token de esa app y pusheamos el bump con eso.
#
# Anti-loop: el push con token de App SÍ dispara workflows, así que el commit
# del bot (prefijo `chore(release):`) se saltea por el `if` de abajo.

on:
  push:
    branches: [main]
  workflow_dispatch: {}   # permite correrlo a mano para testear

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: ${{ github.event_name == 'workflow_dispatch' || !startsWith(github.event.head_commit.message, 'chore(release):') }}
    runs-on: ubuntu-latest
    steps:
      - name: Mintear token de la App perennia-automerge
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.AUTOMERGE_APP_ID }}
          private-key: ${{ secrets.AUTOMERGE_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0                              # historia completa + tags
          token: ${{ steps.app-token.outputs.token }} # push con la identidad de la App (bypassa el ruleset)

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Calcular y aplicar el bump
        id: bump
        run: node bin/release-bump.mjs

      - name: Sanity check del manifiesto (JSON válido)
        if: ${{ steps.bump.outputs.bumped == 'true' }}
        run: node -e "JSON.parse(require('fs').readFileSync('.claude-plugin/plugin.json','utf8'))" && echo "plugin.json OK"

      - name: Commitear bump + tag
        if: ${{ steps.bump.outputs.bumped == 'true' }}
        env:
          V: ${{ steps.bump.outputs.version }}
        run: |
          git config user.name  "perennia-automerge[bot]"
          git config user.email "perennia-automerge[bot]@users.noreply.github.com"
          git add .claude-plugin/plugin.json CHANGELOG.md
          git commit -m "chore(release): wachines-skills v${V}"
          git tag "wachines-skills--v${V}"
          git push origin HEAD:main
          git push origin "wachines-skills--v${V}"

      - name: Tag baseline (primer run, sin bump)
        if: ${{ steps.bump.outputs.baseline == 'true' }}
        env:
          V: ${{ steps.bump.outputs.version }}
        run: |
          git config user.name  "perennia-automerge[bot]"
          git config user.email "perennia-automerge[bot]@users.noreply.github.com"
          git tag "wachines-skills--v${V}"
          git push origin "wachines-skills--v${V}"
