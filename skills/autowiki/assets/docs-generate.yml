name: docs-generate (refresh on merge)

# Regenera docs/reference (GENERADO) al pushear a la branch de integración y
# commitea si cambió. NO es un check de PR: por eso dos PRs nunca se pisan por
# los conteos del generador. Los PRs ya NO llevan docs/reference — se refresca
# solo, al mergear. El commit lleva [skip ci] para no disparar otros workflows.

on:
  push:
    branches: ['__INTEGRATION_BRANCH__']

permissions:
  contents: write

concurrency:
  group: docs-generate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Regenerar docs/reference
        run: node scripts/gen-docs.mjs
      - name: Commitear si cambió
        run: |
          if git diff --quiet -- docs/reference; then
            echo "docs/reference ya al día."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/reference
          git commit -m "docs: regenerar docs/reference [skip ci]"
          git push
